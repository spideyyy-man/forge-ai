[project]
name = "forge-ai-api"
version = "0.1.0"
description = "FORGE AI - Multi-Model Autonomous AI Software Engineering Platform API"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "FORGE AI Core Team", email = "engineering@forgeai.local" }
]
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.1",
    "cryptography>=44.0.0",
    "websockets>=14.1",
    "httpx>=0.28.1",
    "litellm>=1.55.1",
    "langchain>=0.3.12",
    "langgraph>=0.2.56",
    "python-multipart>=0.0.19",
    "redis>=5.2.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM"]
ignore = ["B008"]
