<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hi · FORGE AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0a0f;
        --surface: #111119;
        --border: #222236;
        --ember: #f97316;
        --ember-hot: #fb923c;
        --muted: #9aa3b4;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background-color: var(--bg);
        background-image: radial-gradient(760px 480px at 82% -10%, rgba(249, 115, 22, 0.14), transparent 60%),
          radial-gradient(640px 460px at 8% -6%, rgba(99, 102, 241, 0.1), transparent 55%);
        color: #e9edf5;
        font-family: "Inter", system-ui, sans-serif;
      }
      .card {
        width: min(92vw, 440px);
        padding: 36px 32px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: rgba(17, 17, 25, 0.72);
        backdrop-filter: blur(12px);
        box-shadow: 0 24px 60px -30px rgba(0, 0, 0, 0.9);
        position: relative;
        overflow: hidden;
      }
      .card::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(249, 115, 22, 0.7), transparent);
      }
      .mark {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, var(--ember-hot), #ea580c);
        box-shadow: 0 6px 22px -8px rgba(249, 115, 22, 0.8);
        font-size: 22px;
      }
      h1 {
        font-family: "Space Grotesk", sans-serif;
        font-size: 34px;
        margin: 20px 0 4px;
        letter-spacing: -0.02em;
      }
      .sub { color: var(--muted); font-size: 14px; margin: 0; }
      .status {
        margin-top: 26px;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(10, 10, 15, 0.5);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 13px;
      }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #6b7280; flex: none; }
      .dot.ok { background: #10b981; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15); }
      .dot.bad { background: #f43f5e; box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.15); }
      .status b { font-weight: 600; }
      .meta {
        margin-top: 12px;
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--muted);
        word-break: break-all;
      }
      button {
        margin-top: 18px;
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(180deg, var(--ember-hot), #ea580c);
        color: #fff;
        font: 600 14px "Inter", sans-serif;
        cursor: pointer;
        transition: filter 0.15s ease;
      }
      button:hover { filter: brightness(1.08); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">🔥</div>
      <h1>hi 👋</h1>
      <p class="sub">A tiny page served from the FORGE AI frontend, checking the backend live.</p>

      <div class="status">
        <span id="dot" class="dot"></span>
        <span id="label">Checking backend…</span>
      </div>
      <div class="meta" id="meta"></div>

      <button id="retry">Check again</button>
    </main>

    <script>
      const API = "http://localhost:8000/api/health";
      const dot = document.getElementById("dot");
      const label = document.getElementById("label");
      const meta = document.getElementById("meta");

      async function check() {
        dot.className = "dot";
        label.textContent = "Checking backend…";
        meta.textContent = "";
        try {
          const res = await fetch(API, { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          dot.className = "dot ok";
          label.innerHTML = "Backend is <b>" + (data.status || "healthy") + "</b>";
          meta.textContent = data.service + " · v" + data.version + " · " + API;
        } catch (err) {
          dot.className = "dot bad";
          label.innerHTML = "Backend <b>unreachable</b>";
          meta.textContent = "Start it with: cd apps/api; python run.py  (" + String(err) + ")";
        }
      }

      document.getElementById("retry").addEventListener("click", check);
      check();
    </script>
  </body>
</html>
